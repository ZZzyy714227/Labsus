<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSAE 悬架工作台</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <header id="topbar">
    <div class="brand">■ FSAE SUSPENSION WORKBENCH</div>
    <div class="topbar-actions">
      <span id="summaryLight" class="badge">● --/--</span>
      <button id="btnDash" class="btn btn-cyan">▣ 指标盘</button>
      <button id="btnRevert" class="btn" disabled>⮌ 回退</button>
      <button id="btnCompare" class="btn btn-orange" disabled>⇄ 对比</button>
    </div>
  </header>

  <main id="workbench">
    <aside id="leftCol">
      <div class="col-head">参数</div>
      <div id="paramTabs" class="tabs">
        <button class="tab active" data-tab="geometry">几何</button>
        <button class="tab" data-tab="vehicle">整车</button>
        <button class="tab" data-tab="targets">目标带</button>
      </div>
      <div id="panel-geometry" class="panel-body"></div>
      <div id="panel-vehicle" class="panel-body hidden"></div>
      <div id="panel-targets" class="panel-body hidden"></div>
    </aside>
    <section id="centerCol">
      <div id="scene3d">
        <div id="viewToolbar">
          <span class="vt-group">
            <button class="btn vt" data-view="default">默认</button>
            <button class="btn vt" data-view="top">俯视</button>
            <button class="btn vt" data-view="side">侧视</button>
            <button class="btn vt" data-view="front">前视</button>
            <button class="btn vt" data-view="driver">车手</button>
          </span>
          <span class="vt-group">
            <button class="btn vt" id="btnPointsetPanel">▦ 点阵统计</button>
            <button class="btn vt" id="btnPointsetJson">⬇ 点阵 JSON</button>
            <button class="btn vt" id="btnPointsetCsv">⬇ 点阵 CSV</button>
          </span>
        </div>
        <div id="pointsetPanel" class="hidden">
          <div class="col-head">三维点阵坐标集合 <button id="btnPointsetClose" class="btn">✕</button></div>
          <div id="pointsetList"></div>
        </div>
      </div>
      <div id="sliderBar">
        <label>前轮跳
          <input type="range" id="frontTravel" min="-40" max="40" step="0.5" value="0">
        </label>
        <span id="frontTravelVal" class="mono">0.0 mm</span>
        <label>转向
          <input type="range" id="rackTravel" min="-15" max="15" step="0.5" value="0">
        </label>
        <span id="rackVal" class="mono">0.0 mm</span>
        <span id="solveStatus" class="muted">就绪</span>
      </div>
    </section>
    <aside id="rightCol" class="collapsed">
      <div class="col-head">性能指标盘 <button id="btnDashClose" class="btn">✕ 收起</button></div>
      <div id="dashboard"></div>
    </aside>
  </main>

  <footer id="historyBar">
    <div id="snapshotList"></div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
